<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lilToon Light Edit</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 640px;
      margin: 80px auto;
      padding: 0 24px;
      background: #1a1a2e;
      color: #e0e0e0;
      line-height: 1.6;
    }
    h1 { font-size: 2em; margin-bottom: 0.2em; color: #fff; }
    .subtitle { color: #888; margin-bottom: 1.5em; }
    p { margin: 0.8em 0; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #7c3aed;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #6d28d9; }
    .links { margin-top: 2em; }
    .links a { color: #a78bfa; margin-right: 1em; }
  </style>
</head>
<body>
  <h1>lilToon Light Edit</h1>
  <p class="subtitle">Runtime light editing plugin for lilToon shaders in VRChat</p>

  <p>Adds RadialPuppet sliders to your avatar's Expressions menu, allowing you to adjust light limits, monochrome lighting, shadow environment strength, and unlit mode at runtime.</p>

  <p style="margin-top: 2em;">
    <a class="btn" href="vcc://vpm/addRepo?url=https://aoirusann.github.io/lilToonLightEdit/vpm.json">Add to VCC</a>
  </p>

  <div class="links">
    <a href="https://github.com/aoirusann/lilToonLightEdit">GitHub</a>
  </div>
</body>
</html>
